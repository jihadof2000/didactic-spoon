name: Sanad step edit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  edit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove add-medicine wizard tab and harden phone recording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('website/index.html')
          s = p.read_text(encoding='utf-8')
          old = '    <button class="btn" id="wadd" style="width:100%;margin-top:12px" data-i="addWiz"></button>\n'
          if old not in s:
              raise SystemExit('The + إضافة دواء خطوة بخطوة tab was not found; aborting to avoid unrelated changes.')
          s = s.replace(old, '', 1)
          old_rec = 'try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];recorder=new MediaRecorder(st);'
          new_rec = 'try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];const mimeTypes=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];const mime=mimeTypes.find(x=>MediaRecorder.isTypeSupported?.(x));recorder=mime?new MediaRecorder(st,{mimeType:mime}):new MediaRecorder(st);'
          if old_rec not in s:
              raise SystemExit('The existing phone recording code was not found; aborting to avoid unrelated changes.')
          s = s.replace(old_rec, new_rec, 1)
          if 'getUserMedia' not in s or 'MediaRecorder' not in s or 'id="rec"' not in s:
              raise SystemExit('Audio recording verification failed.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit requested changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sanad-step-edit.yml
          git add website/index.html
          git diff --cached --check
          git commit -m 'Remove add-medicine wizard tab and improve phone audio recording'
          git push
