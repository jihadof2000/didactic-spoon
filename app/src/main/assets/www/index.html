<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12803A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>سند · Sanad</title>
<style>
:root{--bg:#FFF8EC;--card:#fff;--ink:#14181F;--mute:#4A5260;--line:#D8CDB6;--g:#12803A;--gk:#fff;--o:#D9480F;--ok:#fff;--warn:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141B;--card:#1B222D;--ink:#F5F7FA;--mute:#B9C2D0;--line:#3A4556;--g:#3DDC84;--gk:#04210F;--o:#FF922B;--ok:#1A0B00;--warn:#FF8A80}}
:root[data-theme="dark"]{--bg:#0F141B;--card:#1B222D;--ink:#F5F7FA;--mute:#B9C2D0;--line:#3A4556;--g:#3DDC84;--gk:#04210F;--o:#FF922B;--ok:#1A0B00;--warn:#FF8A80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
[hidden]{display:none!important}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:8px 14px 14px;transition:opacity .15s}
header{display:flex;justify-content:space-between;align-items:center;min-height:56px}
#logo{display:flex;align-items:center;gap:10px;padding:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#logo i,.wbrand i{width:40px;height:40px;border-radius:50%;background:var(--g);display:block;position:relative;flex:none}
#logo i:after,.wbrand i:after{content:"";position:absolute;inset:11px 8px;border-radius:9px;background:var(--gk);transform:rotate(-35deg)}
#logo div,.wbrand div{display:flex;flex-direction:column;line-height:1.05}
#logo b,.wbrand b{font-size:30px}
#logo small,.wbrand small{font-size:15px;font-weight:700;color:var(--mute);letter-spacing:.5px}
.langb{min-height:52px;min-width:96px;border-radius:26px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;padding:0 18px}
.card{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:30px;padding:10px 12px}
.card.due{border-color:var(--o);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--o) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.card.due{animation:none}#app{transition:none}}
.st{font-size:20px;font-weight:700;color:var(--mute)}
.card.due .st{color:var(--o)}
.picw{position:relative;width:min(180px,17dvh);aspect-ratio:1;flex:none}
.pen{position:absolute;bottom:-8px;inset-inline-end:-18px;width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--ink);border:3px solid var(--line);font-size:26px;display:flex;align-items:center;justify-content:center;padding:0}
.pen:active{transform:scale(.94)}
.pic{width:100%;height:100%;border-radius:24px;background:#fff;border:2px solid var(--line);overflow:hidden;padding:6px}
.pic img{display:block;width:calc(100% + 12px);height:calc(100% + 12px);margin:-6px;object-fit:cover;max-width:none}
.nm{font-size:clamp(38px,12vw,56px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.tm{font-size:clamp(44px,14vw,66px);font-weight:800;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.tm small{font-size:.38em;font-weight:700;margin-inline-start:.3em;color:var(--mute)}
.big{flex:1 1 0;min-height:64px;border:0;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font-family:inherit}
.big .ic{font-size:clamp(24px,7vw,38px);line-height:1}
.big b{font-size:clamp(30px,9vw,48px);line-height:1.15}
.big.g{background:var(--g);color:var(--gk)}
.big.o{background:var(--o);color:var(--ok)}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.35}
#toast{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:30}
#toast.show{display:flex}
#toast.g{background:var(--g);color:var(--gk)}
#toast.o{background:var(--o);color:var(--ok)}
#toast b{display:block;font-size:clamp(52px,16vw,80px);line-height:1.2;padding:0 20px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 28px}
.cin{max-width:560px;margin:0 auto;font-size:19px}
.gbox{max-width:320px;margin:8vh auto 0;text-align:center}
#dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
#dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
#dots i.f{background:var(--ink)}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
#keys button{min-height:68px;font-size:30px;font-weight:700;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:8px 0}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=time],input[type=tel]{width:100%;min-height:54px;font-size:21px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.btn{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;font-weight:700;padding:0 16px;font-family:inherit}
.btn.p{background:var(--g);color:var(--gk);border-color:var(--g);width:100%;min-height:62px;font-size:22px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:20px;border:2px solid var(--g);background:transparent;color:var(--ink);font-size:18px;font-weight:700;min-height:44px;padding:0 14px;direction:ltr}
.tp{border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.tp .ti{width:42px;height:42px}
.tp.on{border-color:var(--g);box-shadow:0 0 0 3px var(--g)}
.nm2{font-size:clamp(22px,7vw,30px);font-weight:700;color:var(--mute);direction:ltr}
.pv{width:120px;height:120px;border-radius:16px;background:#fff;border:2px solid var(--line);overflow:hidden;padding:4px;flex:none}
.pv img{display:block;width:calc(100% + 8px);height:calc(100% + 8px);margin:-4px;object-fit:cover;max-width:none}
input[type=file]{font-size:17px;width:100%;margin-top:8px}
h3{margin:22px 0 6px;font-size:21px}
.log{font-size:16px;padding:6px 0;border-bottom:1px solid var(--line)}
.log.w{color:var(--warn);font-weight:700}
.small{font-size:15px;color:var(--mute)}
audio{width:100%;margin-top:8px}
.wbrand{display:flex;align-items:center;gap:10px}
.wdots{display:flex;gap:8px;margin:16px 0 8px}.wdots i{flex:1;height:8px;border-radius:4px;background:var(--line)}.wdots i.f{background:var(--g)}
#wiz h2{font-size:30px;margin:12px 0 14px}
#wiz input[type=text],#wiz input[type=time],#wiz input[type=tel]{min-height:64px;font-size:26px}
.credit{flex:none;text-align:center;font-family:"Aref Ruqaa","Amiri","Noto Naskh Arabic","Segoe UI",Tahoma,serif;font-size:clamp(15px,4.3vw,19px);line-height:1.45;color:var(--mute);padding:4px 8px 0;margin:0 auto;border-top:2px dashed var(--line);width:100%;user-select:none;-webkit-user-select:none}
.credit b{display:block;color:var(--g);font-weight:700;font-size:1.02em;line-height:1.4}
.credit b::before,.credit b::after{content:"✦";color:var(--o);font-size:.75em;margin:0 .45em;font-weight:400}
@font-face{font-family:"Aref Ruqaa";font-weight:400;font-style:normal;src:url("fonts/ArefRuqaa-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Aref Ruqaa";font-weight:700;font-style:normal;src:url("fonts/ArefRuqaa-Bold.ttf") format("truetype");font-display:swap}
</style>
</head>
<body>

<div id="app">
  <header>
    <div id="logo"><i></i><div><b>سند</b><small>Sanad</small></div></div>
    <button class="langb" id="lang"></button>
  </header>

  <div class="card" id="card">
    <div class="st" id="st"></div>
    <div class="picw"><div class="pic" id="pic"></div><button class="pen" id="pen" aria-label="edit">✎</button></div>
    <div class="nm" id="nm" dir="auto"></div>
    <div class="nm2" id="nm2"></div>
    <div class="tm" id="tm"></div>
  </div>

  <button class="big g" id="ok"><span class="ic">✔</span><b data-i="ok"></b></button>
  <button class="big o" id="lt"><span class="ic">⏰</span><b data-i="lt"></b></button>
  <div class="credit"><span data-i="credA"></span><b data-i="credN"></b></div>
</div>

<div id="wiz" class="ov" style="z-index:25" hidden>
  <div class="cin">
    <div class="row"><div class="wbrand"><i></i><div><b>سند</b><small>Sanad</small></div></div><button class="langb" id="wlang"></button></div>
    <div class="wdots" id="wdots"></div>
    <h2 id="wt"></h2>
    <div id="wb"></div>
    <div class="credit" style="margin-top:28px"><span data-i="credA"></span><b data-i="credN"></b></div>
    <div class="row" style="margin-top:24px;gap:12px"><button class="btn" id="wback" style="margin:0"></button><button class="btn p" id="wnext" style="margin:0;flex:1"></button></div>
  </div>
</div>

<div id="toast"></div>

<div id="gate" class="ov" hidden>
  <div class="gbox">
    <b style="font-size:24px" data-i="pinT"></b>
    <div id="dots"></div>
    <div id="keys"></div>
    <p class="small" data-i="pinH"></p>
  </div>
</div>

<div id="care" class="ov" hidden>
  <div class="cin">
    <div class="row"><b style="font-size:26px" data-i="careT"></b><button class="btn" id="cx">✕</button></div>

    <button class="btn" id="wadd" style="width:100%;margin-top:12px" data-i="addWiz"></button>
    <h3 id="ft"></h3>
    <div class="box">
      <label data-i="fName"></label><input id="mn" type="text" dir="rtl" lang="ar">
      <label data-i="fNameEn"></label><input id="me" type="text" dir="ltr" lang="en">
      <p class="small" data-i="autoH" style="margin:8px 0 0"></p>
      <label data-i="fType"></label><div class="chips" id="types" style="margin-top:0"></div>
      <label data-i="fPhoto"></label>
      <div class="row" style="justify-content:flex-start;gap:14px"><div class="pv" id="pv"></div><input id="mp" type="file" accept="image/*"></div>
      <label data-i="fTimes"></label>
      <div class="row" style="justify-content:flex-start"><input id="mt" type="time" value="08:00" style="max-width:170px"><button class="btn" id="at">＋</button></div>
      <div class="chips" id="chips"></div>
      <label data-i="fVoice"></label>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="rec"></button><span id="rs" class="small"></span></div>
      <audio id="ra" controls hidden></audio>
      <button class="btn p" id="add"></button>
      <button class="btn" id="cn" style="width:100%;margin-top:10px" data-i="cancel" hidden></button>
    </div>

    <h3 data-i="w_helper"></h3>
    <div class="box"><div class="small" data-i="wCode"></div>
      <div id="sc" style="font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;direction:ltr"></div>
      <label data-i="wPhone"></label><input id="ph" type="tel" dir="ltr">
      <button class="btn p" id="shr" data-i="wShare"></button></div>
    <h3 data-i="meds"></h3><div id="ml"></div>
    <button class="btn" id="tst" style="width:100%;margin-top:10px" data-i="test"></button>
    <h3 data-i="act"></h3><div class="box" id="al"></div>
  </div>
</div>

function status(now){
 let due=null,next=null;
 for(const m of S.meds)if(!(m.end&&now>m.end))for(const tm of m.times){
  const[h,mi]=tm.split(":").map(Number),d=new Date(now);d.setHours(h,mi,0,0);
  const k=m.id+"|"+tm;
  if(S.done[k+d.toDateString()])d.setDate(d.getDate()+1);
  const sn=S.snooze[k],o={m,tm,at:+d,key:k+d.toDateString(),sk:k};
  const snoozed=sn&&sn>now&&o.at<=now;
  if(o.at<=now&&!snoozed){if(!due||o.at<due.at)due=o}
  else{if(snoozed)o.at=sn;if(!next||o.at<next.at)next=o}
 }
 if(test&&!(test.snz>now))due=test;
 return{due,next}
}
